sonar.projectKey=sudhanshugupta-dev_git-rules
sonar.organization=sudhanshugupta-dev
sonar.projectName=git-rules
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=coverage/**, coverage/lcov-report/**, **/coverage/**, jest-coverage/**, **/*.html, **/*.css
sonar.test.exclusions=coverage/**, coverage/lcov-report/**
sonar.coverage.exclusions=coverage/**, coverage/lcov-report/**
