name: Validate PR Checklist

on:
    pull_request:
        branches:
            - development
        types: [opened, reopened, synchronize, ready_for_review]
jobs:
    validate-checklist:
        runs-on: ubuntu-latest

        steps:
            - name: ⬇️ Checkout code
              uses: actions/checkout@v4

            - name: 🔍 Read Pull Request Body
              id: pr_body
              uses: actions/github-script@v7
              with:
                  script: |
                      const body = context.payload.pull_request.body || "";
                      return { body };

            - name: ✅ Validate Required Checkboxes
              id: validate
              run: |
                  echo "Checking required checklist items..."

                  REQUIRED_CHECKBOXES=(
                    "- [x] My code follows the project’s style guidelines"
                    "- [x] I have performed a **self-review** of my code"
                    "- [x] There is no unused/commented code left behind"
                    "- [x] No console logs / debug logs remain"
                    "- [x] I have tested the changes on **Android**"
                    "- [x] I have tested the changes on **iOS**"
                  )

                  BODY="${{ steps.pr_body.outputs.body }}"

                  echo "$BODY" > pr_body.txt

                  MISSING=""

                  for CHECK in "${REQUIRED_CHECKBOXES[@]}"; do
                    if ! grep -q "$CHECK" pr_body.txt; then
                      MISSING="$MISSING\n❌ Missing: $CHECK"
                    fi
                  done

                  if [ -n "$MISSING" ]; then
                    echo -e "PR Checklist validation failed: $MISSING"
                    exit 1
                  fi

                  echo "All required checks passed successfully 🎉"

            - name: 🟩 Success
              if: success()
              run: echo "Checklist validated successfully!"
