name: Validate PR Checklist

on:
    pull_request:
        branches:
            - development
        types: [opened, reopened, synchronize, ready_for_review]

jobs:
    validate-checklist:
        runs-on: ubuntu-latest

        steps:
            - name: Read PR Body
              id: pr_body
              uses: actions/github-script@v7
              with:
                  script: |
                      const body = context.payload.pull_request.body || "";
                      return { body };

            - name: Validate Required Checkboxes
              run: |
                  BODY="${{ steps.pr_body.outputs.body }}"

                  echo "PR Body: $BODY"

                  if [ -z "$BODY" ]; then
                    echo "❌ Pull Request has no description. Please fill the PR template."
                    exit 1
                  fi

                  REQUIRED_ITEMS=(
                    "My code follows the project"
                    "self-review"
                    "unused/commented code"
                    "console logs"
                    "tested the changes on **Android**"
                    "tested the changes on **iOS**"
                  )

                  for ITEM in "${REQUIRED_ITEMS[@]}"; do
                    if ! echo "$BODY" | grep -qi "$ITEM"; then
                      echo "❌ Missing checklist item: $ITEM"
                      exit 1
                    fi
                  done

                  echo "All checklist items completed 🎉"
