name: Expo EAS Build + Firebase Testing

on:
  pull_request:
    branches:
      - development
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: gitrules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install --global eas-cli firebase-tools
          npm install

      - name: Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Logging into Expo..."
          eas whoami || eas login --token "$EXPO_TOKEN" --non-interactive
        continue-on-error: false

      - name: Build Android (APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Building APK for Android..."
          eas build --platform android --profile preview --non-interactive
        continue-on-error: false

      - name: Get latest Android build ID
        id: get-build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Fetching latest build ID..."
          BUILD_ID=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].id')
          if [ -z "$BUILD_ID" ]; then
            echo "Error: Unable to retrieve build ID."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
        continue-on-error: false

      - name: Download built artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Downloading APK artifact..."
          mkdir -p artifacts
          eas build:download --id ${{ steps.get-build.outputs.build_id }} --path artifacts/

          # Check if APK exists
          if [ ! -f "artifacts/*.apk" ]; then
            echo "Error: APK file not found after download."
            exit 1
          fi
          echo "APK downloaded successfully."
        continue-on-error: false

      - name: Set Firebase Credentials
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "Setting Firebase credentials..."
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase.json
          gcloud auth activate-service-account --key-file=firebase.json
          gcloud config set project $(jq -r '.project_id' firebase.json)
        continue-on-error: false

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          echo "Uploading APK to Firebase App Distribution..."
          firebase --version
          firebase appdistribution:distribute artifacts/*.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "qa-team" \
            --release-notes "CI build from PR" \
            --debug
        continue-on-error: false
