name: Android Build + Firebase Distribution

on:
  pull_request:
    branches:
      - development
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout repository
      - name: Step 1 - Checkout repository
        uses: actions/checkout@v4

      # 2 Setup Node
      - name: Step 2 - Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3 Install dependencies
      - name: Step 3 - Install dependencies
        run: |
          npm install
          npm install -g firebase-tools

      # 4 Setup Java (required for Android build)
      - name: Step 4 - Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # # 5 Make Gradle executable
      # - name: Step 5 - Make Gradle executable
      #   run: chmod +x ./gradlew

      # # 6 Build APK using Gradle
      # - name: Step 6 - Build Android Release APK
      #   run: ./gradlew assembleRelease

      - name: STEP 5 - Build Android Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # 7 Verify APK
      - name: Step 7 - Verify generated APK
        run: |
          ls -la android/app/build/outputs/apk/release/

      # 8 Upload APK artifact (optional but useful)
      - name: Step 8 - Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # 9 Upload to Firebase App Distribution
      - name: Step 9 - Upload APK to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          firebase appdistribution:distribute android/app/build/outputs/apk/release/app-release.apk \
          --app "$FIREBASE_APP_ID" \
          --groups "qa-team" \
          --release-notes "CI build from GitHub Actions"
