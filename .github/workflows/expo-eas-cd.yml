name: Expo EAS Build + Firebase Testing

on:
  pull_request:
    branches:
      - development
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: gitrules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install --global eas-cli firebase-tools
          npm install

      - name: Login to Expo
        run: eas whoami || eas login --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (APK)
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download built artifacts
        run: |
          mkdir -p artifacts
          eas build:artifacts --platform android --output artifacts/
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Set Firebase Credentials
        run: |
          echo '${{ secrets.FIREBASE_TOKEN }}' > firebase.json
          gcloud auth activate-service-account --key-file=firebase.json
          gcloud config set project $(jq -r '.project_id' firebase.json)
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'

      - name: Upload APK to Firebase App Distribution
        run: |
          firebase appdistribution:distribute artifacts/*.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups "qa-team" \
            --release-notes "CI build from PR"
