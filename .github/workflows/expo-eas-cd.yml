name: Expo EAS Build + Firebase Testing

on:
  pull_request:
    branches:
      - development
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: gitrules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install --global eas-cli firebase-tools
          npm install

      - name: Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami || eas login --token "$EXPO_TOKEN" --non-interactive

      - name: Build Android (APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive

      # ✅ FIXED — correct way to find latest build
      - name: Get latest Android build ID
        id: get-build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      # ✅ FIXED — correct command to download APK
      - name: Download built artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          eas build:download --id ${{ steps.get-build.outputs.build_id }} --path artifacts/

      # FIXED — secrets safe inside env
      - name: Set Firebase Credentials
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase.json
          gcloud auth activate-service-account --key-file=firebase.json
          gcloud config set project $(jq -r '.project_id' firebase.json)

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          firebase appdistribution:distribute artifacts/*.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "qa-team" \
            --release-notes "CI build from PR"
