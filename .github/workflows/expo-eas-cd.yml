name: EAS Build + Firebase Distribution

on:
  pull_request:
    branches: [development]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install --global eas-cli firebase-tools
          npm install

      ########################################
      # EXPO LOGIN USING TOKEN
      ########################################
      - name: Login to Expo (Non-interactive)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas whoami || eas login --token "$EXPO_TOKEN" --non-interactive

      ########################################
      # EAS BUILD
      ########################################
      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Starting EAS build..."
          eas build --platform android --profile preview --non-interactive --json > build.json
          echo "Build finished."

      ########################################
      # EXTRACT BUILD ID FROM build.json
      ########################################
      - name: Extract Build ID
        run: |
          BUILD_ID=$(jq -r '.id' build.json)
          echo "Build ID: $BUILD_ID"
          echo "$BUILD_ID" > build_id.txt

      ########################################
      # DOWNLOAD APK USING NEW EAS SYNTAX
      ########################################
      - name: Download APK Artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(cat build_id.txt)
          echo "Downloading APK for build: $BUILD_ID"
          eas build:download -i "$BUILD_ID" -o app.apk
          echo "APK downloaded: app.apk"

      ########################################
      # FIREBASE CREDENTIALS
      ########################################
      - name: Set Firebase Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase.json
          gcloud auth activate-service-account --key-file=firebase.json
          PROJECT_ID=$(jq -r '.project_id' firebase.json)
          gcloud config set project $PROJECT_ID

      ########################################
      # UPLOAD TO FIREBASE APP DISTRIBUTION
      ########################################
      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          echo "Uploading APK to Firebase App Distribution..."
          firebase appdistribution:distribute app.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "qa-team" \
            --release-notes "CI automated build from PR"
          echo "Upload completed successfully!"
