name: Expo EAS Build + Firebase Testing

on:
  pull_request:
    branches:
      - development
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: gitrules

    steps:
      # 1. Checkout
      - name: Step 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Step 1.1 - Show git status
        run: |
          echo "Repository checked out. Current status:"
          git status

      # 2. Node setup
      - name: Step 2 - Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Step 2.1 - Verify Node and npm
        run: |
          echo "Node version:"
          node -v
          echo "npm version:"
          npm -v

      # 3. Install deps
      - name: Step 3 - Install dependencies
        run: |
          echo "Installing global CLIs (eas-cli, firebase-tools)"
          npm install --global eas-cli firebase-tools
          echo "Installing project dependencies"
          npm install

      # 4. Expo login
      - name: Step 4 - Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          echo "Checking Expo login status..."
          if eas whoami; then
            echo "Already logged in to Expo."
          else
            echo "Not logged in. Logging in with EXPO_TOKEN..."
            eas login --token "$EXPO_TOKEN" --non-interactive
            echo "Login command completed."
            echo "Verifying login again..."
            eas whoami
          fi

      # 5. Build Android
      - name: Step 5 - Build Android (APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          echo "Starting Android build with profile 'preview'..."
          eas build --platform android --profile preview --non-interactive
          echo "Build command finished."

      # 6. Get latest Android build ID
      - name: Step 6 - Get latest Android build ID
        id: get-build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          echo "Fetching latest Android builds as JSON..."

          BUILD_LIST_OUTPUT_FILE=build_list.json
          BUILD_LIST_ERROR_FILE=build_list_error.log

          if ! eas build:list --platform android --limit 5 --json --non-interactive > "$BUILD_LIST_OUTPUT_FILE" 2> "$BUILD_LIST_ERROR_FILE"; then
            echo "eas build:list command failed."
            echo "--- Stdout ---"
            cat "$BUILD_LIST_OUTPUT_FILE" || echo "<empty>"
            echo "--- Stderr ---"
            cat "$BUILD_LIST_ERROR_FILE" || echo "<empty>"
            exit 1
          fi

          echo "--- Raw JSON Output ---"
          cat "$BUILD_LIST_OUTPUT_FILE" || echo "<empty>"

          # Validate JSON
          if ! jq . "$BUILD_LIST_OUTPUT_FILE" > /dev/null 2>&1; then
            echo "Invalid JSON output:"
            cat "$BUILD_LIST_OUTPUT_FILE"
            exit 1
          fi

          BUILD_ID=$(jq -r '.[0].id // empty' "$BUILD_LIST_OUTPUT_FILE")

          if [ -z "$BUILD_ID" ]; then
            echo "No build id found in JSON."
            jq . "$BUILD_LIST_OUTPUT_FILE"
            exit 1
          fi

          echo "Latest build id: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      # 7. Download artifact
      - name: Step 7 - Download built artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          echo "Downloading APK for build id: ${{ steps.get-build.outputs.build_id }}"
          mkdir -p artifacts
          eas build:download --id ${{ steps.get-build.outputs.build_id }} --path artifacts/

          echo "Listing artifacts:"
          ls -la artifacts || echo "no artifacts directory"

          APK_COUNT=$(ls artifacts/*.apk 2>/dev/null | wc -l || echo "0")
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: No .apk files found."
            exit 1
          fi

          echo "APK files found:"
          ls -la artifacts/*.apk

      # 8. Firebase credentials
      - name: Step 8 - Set Firebase credentials
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase.json

          gcloud auth activate-service-account --key-file=firebase.json

          PROJECT_ID=$(jq -r '.project_id' firebase.json)
          gcloud config set project "$PROJECT_ID"

      # 9. Firebase Upload
      - name: Step 9 - Upload APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -e
          echo "Firebase CLI version:"
          firebase --version

          firebase appdistribution:distribute artifacts/*.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "qa-team" \
            --release-notes "CI build from PR" \
            --debug

          echo "Firebase upload completed."
