name: EAS Build + Firebase Distribution

on:
  pull_request:
    branches: [development]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install --global eas-cli firebase-tools
          npm install

      - name: Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas login --token "$EXPO_TOKEN"

      # FIXED — ensures JSON is written correctly
      - name: Build APK using EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --json > build.json
          echo "Build JSON created:"
          cat build.json

      # FIXED — correct JSON extraction (.id)
      - name: Extract Build ID
        run: |
          BUILD_ID=$(jq -r '.id' build.json)
          echo "$BUILD_ID" > build_id.txt
          echo "Extracted BUILD_ID: $BUILD_ID"

      # FIXED — correct download path, correct command
      - name: Download Build Artifact
        run: |
          BUILD_ID=$(cat build_id.txt)
          echo "Downloading build: $BUILD_ID"
          eas build:download --id "$BUILD_ID" --path app.apk

      # FIXED — Firebase upload (safe env usage)
      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          firebase appdistribution:distribute app.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes "Uploaded via GitHub Actions"
