name: Expo EAS Build + Firebase Testing

on:
  pull_request:
    branches:
      - development
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: gitrules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install --global eas-cli firebase-tools
          npm install

      - name: Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami || eas login --token "$EXPO_TOKEN" --non-interactive

      - name: Build Android (APK)
        id: build-android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          # Build the project and get the response in JSON format
          BUILD_JSON=$(eas build --platform android --profile preview --non-interactive --wait --json)

          # Print BUILD_JSON for debugging
          echo "$BUILD_JSON"

          # Adjust jq based on JSON structure
          if echo "$BUILD_JSON" | jq -e 'type == "array"' > /dev/null; then
            # If it's an array (take first element)
            BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id')
            BUILD_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl')
          else
            # If it's an object
            BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.id')
            BUILD_URL=$(echo "$BUILD_JSON" | jq -r '.artifacts.buildUrl')
          fi

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Download built artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          eas build:download --id "${{ steps.build-android.outputs.build_id }}" --path artifacts/

      # FIXED — secrets safe inside env
      - name: Set Firebase Credentials
        id: firebase-creds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          CREDS_FILE="${RUNNER_TEMP}/firebase.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDS_FILE"
          echo "credentials_file=$CREDS_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase-creds.outputs.credentials_file }}
        run: |
          set -euo pipefail
          PROJECT_ID=$(jq -r '.project_id' "$GOOGLE_APPLICATION_CREDENTIALS")
          firebase appdistribution:distribute artifacts/*.apk \
            --app "$FIREBASE_APP_ID" \
            --project "$PROJECT_ID" \
            --groups "qa-team" \
            --release-notes "CI build from PR"
