name: PR Checks

on:
  pull_request:
    branches:
      - development
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  branch_check:
    uses: ./.github/workflows/branch-validation.yml

  prettier_check:
    needs: branch_check
    uses: ./.github/workflows/pret-tier.yml

  eslint_check:
    needs: prettier_check
    uses: ./.github/workflows/es-lint.yml

  test_check:
    needs: eslint_check
    uses: ./.github/workflows/jest-test.yml

  Commit_Check_messages:
    uses: ./.github/workflows/commit-message-check.yml
