name: Commit_Check_messages

on:
  pull_request:
    branches:
      - development
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  Commit_Check_messages:
    name: Checkout_code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          echo "Checking commit messages..."

          # Allowed prefixes (fixed)
          ALLOWED="^(add|update|delete|modify|fix|testing|merge:|Merge )"

          git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s" > commits.txt

          echo "Commit messages found:"
          cat commits.txt
          echo "---------------------------"

          while IFS= read -r line
          do
            if ! [[ "$line" =~ $ALLOWED ]]; then
              echo "❌ ERROR: Commit message does not start with required keyword:"
              echo "    \"$line\""
              echo ""
              echo "Allowed prefixes: add:, update:, delete:, modify:, fix:, testing:, merge:, Merge <auto>"
              exit 1
            fi
          done < commits.txt

          echo "✅ All commit messages are valid"
