name: Commit Message Check (Start With Required Keywords)

on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    commit-message-validation:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Allows reading all commit messages

            - name: Validate commit messages
              run: |
                  echo "Checking commit messages..."

                  # Allowed prefixes
                  ALLOWED="^(add|update|delete|modify|fix|testing):"

                  # Get all commit messages in the PR
                  git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s" > commits.txt

                  echo "Commit messages found:"
                  cat commits.txt
                  echo "---------------------------"

                  # Validate each commit
                  while IFS= read -r line
                  do
                    if ! [[ "$line" =~ $ALLOWED ]]; then
                      echo "❌ ERROR: Commit message does not start with required keyword:"
                      echo "    \"$line\""
                      echo ""
                      echo "Allowed prefixes: add:, update:, delete:, modify:, fix:, testing:"
                      exit 1
                    fi
                  done < commits.txt

                  echo "✅ All commit messages are valid"
